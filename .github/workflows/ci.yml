name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Check the generated table of identifiers is current
        run: python tools/make_id_table.py --check
      - name: Check out the virtual board of the shared package (URTC-COMMON)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/URTC-COMMON
          path: urtc-common-model
          persist-credentials: false
      - name: Install and run the real Python test suite (with the gateway tried end to end against the virtual board)
        env:
          URTC_COMMON_SRC: ${{ github.workspace }}/urtc-common-model/src
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pytest tests/ -q --cov=urtc_gateway --cov-fail-under=66
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the tests (line endings and file modes behave differently on Windows)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pytest tests -q
