[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urtc-gateway"
version = "0.0.1"
description = "A gateway in front of the URTC CAN bus: a list of allowed identifiers made from the protocol specification, a rate limit and a session key."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["urtc", "can-bus", "gateway", "security", "slcan"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff>=0.6", "pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/JuanenRac/URTC-GATEWAY"

[project.scripts]
urtc-gateway = "urtc_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
extend-exclude = ["src/urtc_gateway/urtc_protocol.py", "tools/_doc_policy.py", "tools/_readme_parity.py", "tools/_tracked_names.py", "tools/ci_validate.py", "tools/build_test.py", "bump_manifest_version.py", "bump_version.py"]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
